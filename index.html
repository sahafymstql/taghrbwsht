<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="icon" href="https://qaryat.xyz/wp-content/uploads/file_00000000525c61f8afbbc7b590d1c6ef_1749847919915.jpeg">

<title>🎧 مكتبة تاغربوشت الصوتية</title>

<meta name="description" content="استمع إلى محاضرات ودروس صوتية باللغة العربية من مكتبة تاغربوشت الصوتية">

<style>
body{
  font-family:'Tajawal',sans-serif;
  background:#f5f7ff;
  margin:0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

header{
  text-align:center;
  padding:20px;
  background:#2563eb;
  color:#fff;
  font-size:1.6rem;
  font-weight:700;
}

main{
  flex:1;
  padding:12px;
  padding-bottom:110px;
}

#backBtn{
  margin:12px;
  display:none;
  background:#2563eb;
  color:#fff;
  padding:11px;
  border:none;
  border-radius:8px;
  width:calc(100% - 24px);
}

#searchInput{
  display:none;
  margin:0 12px 15px;
  padding:12px;
  width:calc(100% - 24px);
  border:1px solid #ccc;
  border-radius:10px;
}

#listContainer{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.item-card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid #e5e7eb;
  cursor:pointer;
}

.item-card.active{
  background:#eef3ff;
  border-color:#2563eb;
}

.play-button{
  background:#2563eb;
  color:#fff;
  padding:8px;
  border:none;
  border-radius:8px;
}

.message{
  text-align:center;
  padding:40px;
}

#audioPlayerContainer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#1d4ed8;
  padding:12px;
  transform:translateY(100%);
  transition:.3s;
  color:#fff;
  border-radius:15px 15px 0 0;
}

#audioPlayerContainer.active{
  transform:translateY(0);
}

audio{
  width:100%;
}
</style>
</head>

<body>

<header>🎧 مكتبة تاغربوشت الصوتية</header>

<button id="backBtn">العودة إلى الأقسام</button>
<input id="searchInput" placeholder="🔍 ابحث عن مقطع صوتي...">

<main>
  <div id="listContainer"><div class="message">جاري التحميل...</div></div>
</main>

<div id="audioPlayerContainer">
  <div style="display:flex;justify-content:space-between">
    <span id="audioFileName"></span>
    <button id="closePlayerBtn">&times;</button>
  </div>
  <audio controls></audio>
</div>

<script>
const apiUrl='https://qaryat.xyz/list_audio.php';

const listContainer=document.getElementById('listContainer');
const backBtn=document.getElementById('backBtn');
const searchInput=document.getElementById('searchInput');
const audioContainer=document.getElementById('audioPlayerContainer');
const audioElem=audioContainer.querySelector('audio');
const audioNameElem=document.getElementById('audioFileName');
const closeBtn=document.getElementById('closePlayerBtn');

let audioFiles=[];
let currentIndex=-1;

/* ===== تحويل الاسم إلى رابط ===== */
function slugify(name){
  return encodeURIComponent(name).replace(/%20/g,'_');
}

/* ===== قراءة الرابط ===== */
function getFolderFromURL(){
  let path = decodeURIComponent(window.location.pathname);
  if(path === "/") return "";
  return path.substring(1).replace(/_/g,' ');
}

/* ===== بحث عربي ===== */
function normalize(s){
  return s.toLowerCase().replace(/[أإآ]/g,'ا');
}

/* ===== ترتيب ===== */
function sortFiles(arr){
  return arr.sort((a,b)=>
    a.name.localeCompare(b.name,'ar',{numeric:true})
  );
}

/* ===== تمييز ===== */
function setActive(index){
  document.querySelectorAll('.item-card')
    .forEach((c,i)=>c.classList.toggle('active',i===index));
}

/* ===== تحميل ===== */
function loadContent(folder=''){

  backBtn.style.display=folder?'block':'none';
  searchInput.style.display=folder?'block':'none';
  searchInput.value='';

  listContainer.innerHTML='<div class="message">جاري التحميل...</div>';

  fetch(folder?apiUrl+'?folder='+encodeURIComponent(folder):apiUrl)
  .then(r=>r.json())
  .then(data=>{

    listContainer.innerHTML='';

    if(!data.length){
      listContainer.innerHTML='<div class="message">لا توجد عناصر</div>';
      return;
    }

    if(!folder){

      data.filter(i=>i.type==='folder').forEach(f=>{
        const div=document.createElement('div');
        div.className='item-card';
        div.textContent='📁 '+f.name;

        div.onclick=()=>{
          history.pushState(null,"","/"+slugify(f.name));
          loadContent(f.path);
        };

        listContainer.appendChild(div);
      });

    }else{

      audioFiles=sortFiles(
        data.filter(i=>i.type==='file' && /\.(mp3|wav|ogg)$/i.test(i.name))
      );

      render(audioFiles);
    }
  });
}

/* ===== عرض ===== */
function render(files){

  listContainer.innerHTML='';

  files.forEach((f,i)=>{

    const div=document.createElement('div');
    div.className='item-card';

    div.innerHTML=`
      <span><i class="fa-solid fa-music"></i> ${f.name}</span>
      <button class="play-button"><i class="fa-solid fa-play"></i></button>
    `;

    div.onclick=()=>play(f,i);

    div.querySelector('.play-button').onclick=(e)=>{
      e.stopPropagation();
      play(f,i);
    };

    listContainer.appendChild(div);
  });
}

/* ===== تشغيل ===== */
function play(file,index){

  currentIndex=index;

  audioElem.pause();
  audioElem.currentTime=0;

  audioElem.src=file.url;
  audioElem.play().catch(()=>{});

  audioNameElem.textContent=file.name;

  setActive(index);

  audioContainer.classList.add('active');
}

/* ===== التالي ===== */
audioElem.onended=()=>{
  if(audioFiles[currentIndex+1]){
    play(audioFiles[currentIndex+1],currentIndex+1);
  }
};

/* ===== بحث ===== */
searchInput.oninput=()=>{
  const q=normalize(searchInput.value);
  render(audioFiles.filter(f=>normalize(f.name).includes(q)));
};

/* ===== رجوع المتصفح ===== */
window.onpopstate=()=>{
  loadContent(getFolderFromURL());
};

/* ===== إغلاق ===== */
closeBtn.onclick=()=>{
  audioElem.pause();
  audioElem.src='';
  audioContainer.classList.remove('active');
  setActive(-1);
};

backBtn.onclick=()=>{
  history.pushState(null,"","/");
  loadContent('');
};

/* ===== تشغيل أولي ===== */
loadContent(getFolderFromURL());
</script>

</body>
</html>
